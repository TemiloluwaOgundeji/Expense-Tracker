services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-postgres

    restart: always

    environment:
      POSTGRES_USER: apple
      POSTGRES_PASSWORD: iloveGod100@
      POSTGRES_DB: expense_tracker

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: expense-backend

    restart: always

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql://apple:iloveGod100%40@postgres:5432/expense_tracker?schema=public
      JWT_SECRET: your_super_secret_jwt_key
      PORT: 4000

    ports:
      - "4000:4000"
      - "5555:5555"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/expenses

    container_name: expense-frontend

    restart: always

    depends_on:
      - backend

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/expenses

    ports:
      - "3000:3000"

volumes:
  postgres_data: